platform_signature: ashby
version: 1
match:
  url_pattern: "*jobs.ashbyhq.com/*"
  dom_markers:
    - "form[data-form='application']"

fields:
  - selector: "input[name='_systemfield_name']"
    source: secret.JOB_HUNTER_FULL_NAME
    required: true
  - selector: "input[name='_systemfield_email']"
    source: profile.links.email
    required: true
  - selector: "input[name='_systemfield_phoneNumber']"
    source: secret.JOB_HUNTER_PHONE
    required: true
  - selector: "input[name='_systemfield_resume']"
    source: file.resume_en
    required: true
  - selector: "input[name='_systemfield_linkedinUrl']"
    source: profile.links.linkedin
  - selector: "input[name='_systemfield_githubUrl']"
    source: profile.links.github

submit:
  selector: "button[type='submit']"
  mode: shadow
  auto_eligible: false
  pre_submit_checks:
    - screenshot
    - assert_no_pii_in_logs
    - assert_all_required_filled
  cooldown_seconds: 30
