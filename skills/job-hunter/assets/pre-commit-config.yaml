# Copy this file to your target repo as `.pre-commit-config.yaml` to enforce
# the same PII-leak prevention this skill enforces in CI. Tailored for repos
# that track *output* from this skill (tracking.md, runs/, exports).
#
# Install once:
#   pip install pre-commit
#   pre-commit install
#
# The detect-secrets baseline must be committed alongside this file:
#   detect-secrets scan > .secrets.baseline
#   pre-commit run detect-secrets --all-files

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: \.example$|\.secrets\.baseline$

  - repo: local
    hooks:
      - id: job-hunter-pii-lint
        name: job-hunter PII pattern check
        # Requires job-hunter installed: `uv tool install --from git+https://... job-hunter`
        entry: job-hunter-lint --paths
        language: system
        pass_filenames: true
        types: [text]
        exclude: \.example$|\.secrets\.baseline$
