platform_signature: workday
version: 1
match:
  url_pattern: "*.myworkdayjobs.com/*"
  dom_markers:
    - "[data-automation-id='applyManually']"

# Workday is a paginated wizard. Fields belong to the "myInformation" step;
# apply.py will detect step buttons and advance. Later steps (myExperience,
# applicationQuestions) are best handled by `learn.py` per posting.
fields:
  - selector: "[data-automation-id='firstName']"
    source: profile.first_name
    required: true
  - selector: "[data-automation-id='lastName']"
    source: profile.last_name
    required: true
  - selector: "[data-automation-id='email']"
    source: profile.links.email
    required: true
  - selector: "[data-automation-id='phone-number']"
    source: secret.JOB_HUNTER_PHONE
    required: true
  - selector: "input[type='file'][data-automation-id='file-upload-input-ref']"
    source: file.resume_en

submit:
  selector: "[data-automation-id='wizardSubmitButton']"
  mode: shadow
  auto_eligible: false
  pre_submit_checks:
    - screenshot
    - assert_no_pii_in_logs
    - assert_all_required_filled
  cooldown_seconds: 30
