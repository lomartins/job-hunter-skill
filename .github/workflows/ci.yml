name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      - name: Secret-leak lint (own repo + fixtures)
        run: |
          uv run python skills/job-hunter/scripts/lint_secret_leaks.py \
            --paths skills/job-hunter/scripts skills/job-hunter/assets skills/job-hunter/references

      - name: Validate marketplace.json
        run: uv run python .github/scripts/validate_marketplace.py

  version-bump-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that touching skills/job-hunter bumps marketplace version
        run: python .github/scripts/check_version_bump.py "${{ github.base_ref }}" "${{ github.head_ref }}"
